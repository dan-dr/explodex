name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to verify
        required: true
        type: string
      registry_sha256:
        description: Approved registry.json SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: macos-14
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Node.js test matrix
        uses: jdx/mise-action@v4
        with:
          install_args: "node@22 node@24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"

      - name: Run full validation
        run: bun run validate

      - name: Pack public npm packages
        run: |
          npm pack --dry-run --json ./packages/sdk
          npm pack --dry-run --json ./packages/cli

      - name: Build deterministic plugin artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_REGISTRY_SHA256: ${{ inputs.registry_sha256 }}
        run: |
          ARTIFACTS="$RUNNER_TEMP/artifacts"
          STAGING="$RUNNER_TEMP/staging"
          mkdir -p "$ARTIFACTS"
          for plugin in packages/plugin-registry/explodex-plugin-*; do
            bun packages/cli/src/bin/explodex.ts --json plugin validate "$plugin"
            bun packages/cli/src/bin/explodex.ts --json plugin build "$plugin"
            bun packages/cli/src/bin/explodex.ts --json plugin package "$plugin" --output "$ARTIFACTS"
          done
          bun run --cwd packages/plugin-registry registry:stage -- \
            --artifact-dir "$ARTIFACTS" \
            --output-dir "$STAGING" \
            --release-tag "$RELEASE_TAG"
          test "$(shasum -a 256 "$STAGING/registry.json" | awk '{print $1}')" = "$EXPECTED_REGISTRY_SHA256"

      - name: Require clean generated diff
        run: git diff --exit-code
